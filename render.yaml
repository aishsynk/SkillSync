services:
  - type: web
    name: skilledge-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker keeps the in-process warm/response caches coherent (see
    # _warm_payload_cache / _allocation_payload_cache in backend.py); the app is
    # I/O-bound on RMS calls so 8 threads give real concurrency. --timeout 120
    # (gunicorn default is 30s) lets a cold trainer-360 / capability build finish
    # instead of the worker being killed mid-request and returning 502.
    startCommand: gunicorn backend:app --workers 1 --threads 8 --worker-class gthread --timeout 120
    # Persistent disk so the action inbox, session-revocation denylist and
    # notification seen-state survive redeploys (Render's default filesystem is
    # ephemeral and was wiping all three on every deploy).
    disk:
      name: skilledge-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SKILLEDGE_ENV
        value: production
      - key: SKILLEDGE_STATE_DIR
        value: /var/data
      - key: PYTHONUNBUFFERED
        value: "true"
    # ── Communication Intelligence model providers (optional) ─────────────
    #
    # Resolution: Ollama -> Azure OpenAI / OpenAI -> deterministic generator.
    # Ollama CANNOT run on this service: the free plan (512 MB RAM, shared
    # CPU, no long-running side processes, spins down when idle) cannot hold
    # a multi-GB model. Point OLLAMA_BASE_URL only at a PRIVATE Ollama host
    # this service can reach (never a public endpoint):
    #   OLLAMA_BASE_URL          e.g. http://10.0.0.5:11434  (scheme://host:port only)
    #   OLLAMA_MODEL             installed chat model, e.g. qwen2.5:7b-instruct
    #   OLLAMA_TIMEOUT_SECONDS   default 20, capped at 60
    # Unset => provider skipped, no network call. Existing OpenAI/Azure vars
    # (OPENAI_API_KEY / AZURE_OPENAI_*) remain the second provider.
    #
    # ── RMS credential env vars (configure as Render secrets via dashboard) ─
    #
    # Every API in _APIS (backend.py) reads its credentials from
    # SKILLEDGE_RMS_{NAME}_USER / _PASS environment variables. The hardcoded
    # fallbacks in _APIS are temporary migration defaults; once these env
    # vars are confirmed set on the host, _validate_credentials() stops
    # warning and the fallbacks are removed.
    #
    # Required (active APIs):
    #   SKILLEDGE_RMS_REPORTEES_USER, SKILLEDGE_RMS_REPORTEES_PASS
    #   SKILLEDGE_RMS_TRAINER_DETAILS_USER, SKILLEDGE_RMS_TRAINER_DETAILS_PASS
    #   SKILLEDGE_RMS_UTILIZATION_USER, SKILLEDGE_RMS_UTILIZATION_PASS
    #   SKILLEDGE_RMS_PREVUPCOMING_USER, SKILLEDGE_RMS_PREVUPCOMING_PASS
    #   SKILLEDGE_RMS_UNALLOCATED_USER, SKILLEDGE_RMS_UNALLOCATED_PASS
    #   SKILLEDGE_RMS_COURSE_WITHOUT_EXAM_USER, SKILLEDGE_RMS_COURSE_WITHOUT_EXAM_PASS
    #   SKILLEDGE_RMS_ASSIGNMENT_USER, SKILLEDGE_RMS_ASSIGNMENT_PASS
    #   SKILLEDGE_RMS_NEG_FEEDBACK_COUNT_USER, SKILLEDGE_RMS_NEG_FEEDBACK_COUNT_PASS
    #   SKILLEDGE_RMS_HR_INCIDENT_USER, SKILLEDGE_RMS_HR_INCIDENT_PASS
    #   SKILLEDGE_RMS_TRAINER_NEG_FEEDBACK_USER, SKILLEDGE_RMS_TRAINER_NEG_FEEDBACK_PASS
    #   SKILLEDGE_RMS_TRAINER_SKILLS_USER, SKILLEDGE_RMS_TRAINER_SKILLS_PASS
    #   SKILLEDGE_RMS_VENDOR_CERT_COUNT_USER, SKILLEDGE_RMS_VENDOR_CERT_COUNT_PASS
    #   SKILLEDGE_RMS_RESUME_USER, SKILLEDGE_RMS_RESUME_PASS
    #   SKILLEDGE_RMS_ADD_TRAINER_SKILL_USER, SKILLEDGE_RMS_ADD_TRAINER_SKILL_PASS
    #
    # Dormant (registered in _APIS, no route call yet — set for completeness):
    #   SKILLEDGE_RMS_UPCOMING_ASSIGNMENTS_USER, SKILLEDGE_RMS_UPCOMING_ASSIGNMENTS_PASS
    #   SKILLEDGE_RMS_TRAINER_FEEDBACK_USER, SKILLEDGE_RMS_TRAINER_FEEDBACK_PASS
    #   SKILLEDGE_RMS_TRAINER_AVAILABILITY_USER, SKILLEDGE_RMS_TRAINER_AVAILABILITY_PASS
    #   SKILLEDGE_RMS_SCID_USER, SKILLEDGE_RMS_SCID_PASS
    #   SKILLEDGE_RMS_ACTIVE_SC_DATE_USER, SKILLEDGE_RMS_ACTIVE_SC_DATE_PASS
    #   SKILLEDGE_RMS_ASSIGNMENT_PAX_USER, SKILLEDGE_RMS_ASSIGNMENT_PAX_PASS
    #   SKILLEDGE_RMS_RECORDING_DETAILS_USER, SKILLEDGE_RMS_RECORDING_DETAILS_PASS
    #   SKILLEDGE_RMS_LAST_3_MONTHS_UTIL_USER, SKILLEDGE_RMS_LAST_3_MONTHS_UTIL_PASS
    #   SKILLEDGE_RMS_COURSE_SYLLABUS_USER, SKILLEDGE_RMS_COURSE_SYLLABUS_PASS
    #   SKILLEDGE_RMS_COURSE_CATALOGUE_USER, SKILLEDGE_RMS_COURSE_CATALOGUE_PASS
    #   SKILLEDGE_RMS_COURSE_SCHEDULE_USER, SKILLEDGE_RMS_COURSE_SCHEDULE_PASS
    #   SKILLEDGE_RMS_GLOBAL_TRAINERS_USER, SKILLEDGE_RMS_GLOBAL_TRAINERS_PASS
    #   SKILLEDGE_RMS_COURSE_AVAILABILITY_USER, SKILLEDGE_RMS_COURSE_AVAILABILITY_PASS
