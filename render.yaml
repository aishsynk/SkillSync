services:
  - type: web
      name: skilledge-backend
          runtime: python
              plan: free
                  buildCommand: pip install -r requirements.txt
                      startCommand: python server.py
                          envVars:
                                - key: SKILLEDGE_ENV
                                        value: production
                                              - key: SKILLEDGE_PORT
                                                      fromService:
                                                                type: web
                                                                          name: skilledge-backend
                                                                                    property: port
                                                                                          - key: SKILLEDGE_LOG_LEVEL
                                                                                                  value: INFO
                                                                                                        - key: SKILLEDGE_LOG_FORMAT
                                                                                                                value: json
                                                                                                                      - key: PYTHONUNBUFFERED
                                                                                                                              value: "true"
                                                                                                                                    - key: SKILLEDGE_DEFAULT_EMAIL
                                                                                                                                            sync: false
                                                                                                                                                  - key: SKILLEDGE_REFRESH_EMAIL
                                                                                                                                                          sync: false
