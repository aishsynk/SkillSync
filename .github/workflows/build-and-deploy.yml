name: Build, Test & Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Python Backend Tests
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-cov

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test backend with pytest
      run: |
        cd backend && pytest tests/ -v --cov=. --cov-report=xml
      continue-on-error: true

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  # Android Build
  android-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: gradle

    - name: Make Gradle executable
      run: chmod +x android/gradlew

    - name: Build Android APK (Debug)
      run: |
        cd android
        ./gradlew assembleDebug --warning-mode all

    - name: Build Android Release APK
      run: |
        cd android
        ./gradlew assembleRelease --warning-mode all
      continue-on-error: true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: android-apk-${{ github.run_number }}
        path: android/app/build/outputs/apk/
        retention-days: 30

  # Deploy to Vercel
  deploy-vercel:
    needs: backend-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: |
        npm install -g vercel
        vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # Create Release
  create-release:
    needs: [backend-test, android-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Generate Version
      id: version
      run: |
        VERSION=$(date +%Y.%m.%d.%H%M)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Download APK
      uses: actions/download-artifact@v3
      with:
        name: android-apk-${{ github.run_number }}
        path: ./apk-artifacts

    - name: Rename APK
      run: |
        mkdir -p releases
        if [ -f apk-artifacts/release/app-release.apk ]; then
          cp apk-artifacts/release/app-release.apk releases/SkillEdge-v${{ steps.version.outputs.version }}.apk
        elif [ -f apk-artifacts/debug/app-debug.apk ]; then
          cp apk-artifacts/debug/app-debug.apk releases/SkillEdge-v${{ steps.version.outputs.version }}-debug.apk
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.version }}
        release_name: SkillEdge v${{ steps.version.outputs.version }}
        body: |
          ## Release: SkillEdge v${{ steps.version.outputs.version }}

          **Build Date:** ${{ github.event.head_commit.timestamp }}
          **Commit:** ${{ github.sha }}

          ### Changes
          - Backend: Phase 1 MVP (non-blocking auth, deterministic agentic layer)
          - Frontend: Dashboard with KPIs, team view, action queue
          - Android: Phase 1 MVP (Login, Dashboard screens, Jetpack Compose)

          ### Files
          - SkillEdge-v${{ steps.version.outputs.version }}.apk - Production release

          ### Installation
          1. Download the APK file
          2. Transfer to Android device or use emulator
          3. `adb install SkillEdge-v${{ steps.version.outputs.version }}.apk`
          4. Launch SkillEdge from app drawer

          ### Testing
          - Test login with valid email
          - Verify dashboard loads with KPIs
          - Check API connectivity to backend
          - Test dark mode toggle
        files: releases/SkillEdge-v${{ steps.version.outputs.version }}*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
