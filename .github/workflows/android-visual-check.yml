name: Design V2 Visual Validation

# Isolated diagnostic/checkpoint workflow for the D2 visual checkpoint.
# Deliberately separate from android-release.yml: no signing, no version
# bump, no tag, no GitHub Release.
#
# History:
# - PilotScreenshotTest (JVM/Robolectric, captureToImage) deadlocks in
#   WindowCapture.forceRedraw/PixelCopy on both Windows (local) and an
#   ubuntu-latest runner (confirmed via this same workflow) — Robolectric
#   pixel capture is not usable for this checkpoint regardless of OS.
# - PilotScreenshotInstrumentedTest (real emulator) passed 4/4, but a plain
#   `adb pull` of getExternalFilesDir() afterwards raced Gradle's own
#   uninstall of the app-under-test, which runs as soon as the test task
#   finishes. Test Orchestrator + Test Storage (app/build.gradle.kts) copy the
#   test's output files off the device before that uninstall happens, landing
#   them under app/build/outputs/connected_android_test_additional_output/.
on:
  push:
    branches:
      - design-v2-visual-check
  pull_request:
    branches:
      - design-v2-visual-check
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./SkillEdge_Android

    steps:
      - uses: actions/checkout@v5

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run PilotScreenshotInstrumentedTest on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./SkillEdge_Android
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.skillsync.ui.PilotScreenshotInstrumentedTest --console=plain

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-v2-pilot-screenshots
          path: SkillEdge_Android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-v2-pilot-screenshot-test-report
          path: SkillEdge_Android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
