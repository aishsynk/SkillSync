name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./SkillEdge_Android

    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_B64 }}
      run: |
        echo $ENCODED_STRING | base64 -di > release.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=../release.jks -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Get App Version
      id: get_version
      run: |
        echo "version_name=$(grep versionName app/build.gradle.kts | awk -F '"' '{print $2}')" >> $GITHUB_OUTPUT
        echo "version_code=$(grep versionCode app/build.gradle.kts | awk '{print $3}')" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        VERSION_NAME=${{ steps.get_version.outputs.version_name }}
        VERSION_CODE=${{ steps.get_version.outputs.version_code }}
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SkillEdge-v${VERSION_NAME}.${VERSION_CODE}.apk

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version_name }}.${{ steps.get_version.outputs.version_code }}
        name: SkillSync Release v${{ steps.get_version.outputs.version_name }}.${{ steps.get_version.outputs.version_code }}
        draft: false
        prerelease: false
        files: SkillEdge_Android/app/build/outputs/apk/release/SkillEdge-v*.apk
