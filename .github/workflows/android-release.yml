name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    # Docs, the Flask backend and the web app cannot change the APK, so they must
    # not spend a hosted runner. (A push touching these *and* app code still runs:
    # paths-ignore only skips when every changed file matches.)
    paths-ignore:
      - '**.md'
      - 'AI/**'
      - 'docs/**'
      - 'backend.py'
      - 'SkillEdge_Local/**'
      - 'trainer_portal_api_details/**'
  workflow_dispatch:

# Supersede queued builds for the same branch. Several pushes in quick succession
# should produce one APK, not N builds competing for the same runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Without this a stuck job sits for the 6h default before anyone notices.
    timeout-minutes: 30
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./SkillEdge_Android

    steps:
    # v3 actions run on the retired Node 16 runtime and are the ones that hit
    # "Failed to resolve action download info" on 2026-08-06.
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      env:
        ENCODED_STRING: ${{ secrets.KEYSTORE_B64 }}
      run: |
        echo $ENCODED_STRING | base64 -di > release.jks

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/SkillEdge_Android/release.jks -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD

    - name: Get App Version
      id: get_version
      run: |
        echo "version_name=$(grep versionName app/build.gradle.kts | awk -F '"' '{print $2}')" >> $GITHUB_OUTPUT
        echo "version_code=$(grep versionCode app/build.gradle.kts | awk '{print $3}')" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        VERSION_NAME=${{ steps.get_version.outputs.version_name }}
        VERSION_CODE=${{ steps.get_version.outputs.version_code }}
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/SkillEdge-v${VERSION_NAME}.${VERSION_CODE}.apk

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.get_version.outputs.version_name }}.${{ steps.get_version.outputs.version_code }}
        name: SkillSync Release v${{ steps.get_version.outputs.version_name }}.${{ steps.get_version.outputs.version_code }}
        draft: false
        prerelease: false
        files: SkillEdge_Android/app/build/outputs/apk/release/SkillEdge-v*.apk
