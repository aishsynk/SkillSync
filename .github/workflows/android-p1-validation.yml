name: SkillEdge P1 Validation

# Isolated remote validation for the P0 (9500bc4) + P1 (f214c37) architecture
# fixes on the skilledge-p1-validation branch. Deliberately separate from
# android-release.yml: no keystore, no signing secrets, no version bump, no
# tag, no GitHub Release. The debug APK built here is for manual install/test
# only, and debug builds are signed with the same keystore as release only
# when keystore.properties exists locally — on this runner there is none, so
# the assembleDebug output here is a normal ad-hoc-signed debug APK.
on:
  push:
    branches:
      - skilledge-p1-validation
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: ./SkillEdge_Android

    steps:
      - uses: actions/checkout@v5

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile (debug, release, androidTest)
        run: |
          ./gradlew :app:compileDebugKotlin :app:compileReleaseKotlin :app:compileDebugAndroidTestKotlin --console=plain

      - name: Focused P1 unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests "com.example.skillsync.feature.report.ui.SkillRequestsViewModelTest" \
            --tests "com.example.skillsync.feature.training.ui.MyScheduleViewModelTest" \
            --tests "com.example.skillsync.feature.home.CapacityBandTest" \
            --console=plain

      - name: Full unit-test suite (baseline comparison, non-fatal here)
        # Known baseline: 266 tests, 11 documented failures (7 obsolete-spec
        # ScreenRenderTest + 4 Robolectric-limitation PilotScreenshotTest).
        # continue-on-error lets us upload the report and diff failing-test
        # names in the next step rather than treating gradle's exit code
        # alone as "new regression".
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Compare full-suite failures against the known baseline
        run: |
          RESULTS=app/build/test-results/testDebugUnitTest
          if [ ! -d "$RESULTS" ]; then
            echo "::error::No test results found at $RESULTS"
            exit 1
          fi
          # Extract every failing testcase name across all XML result files.
          python3 - "$RESULTS" <<'PYEOF'
          import sys, glob, re
          results_dir = sys.argv[1]
          failing = set()
          total = 0
          for f in glob.glob(f"{results_dir}/TEST-*.xml"):
              content = open(f, encoding="utf-8").read()
              total += len(re.findall(r'<testcase ', content))
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure', content):
                  failing.add(f"{m.group(2)}#{m.group(1)}")

          known_baseline = {
              "com.example.skillsync.ui.ScreenRenderTest#dashboard_certKpisAreNotZeroBeforeCapabilityLoads",
              "com.example.skillsync.ui.ScreenRenderTest#dashboard_identifiesTheSignedInManager",
              "com.example.skillsync.ui.ScreenRenderTest#dashboard_isAManagerCommandCentreNotCriticalPulse",
              "com.example.skillsync.ui.ScreenRenderTest#dashboard_showsRealAvailabilitySeparatelyFromWorkloadBands",
              "com.example.skillsync.ui.ScreenRenderTest#dashboard_attentionCardsCarryTheirRecommendedAction",
              "com.example.skillsync.ui.ScreenRenderTest#dashboard_showsDeliveryAndCapacityDecisions",
              "com.example.skillsync.ui.ScreenRenderTest#dashboard_usesCompactSemanticKpisAndRestoresTopPerformers",
              "com.example.skillsync.ui.PilotScreenshotTest#today_screenshot",
              "com.example.skillsync.ui.PilotScreenshotTest#thisWeek_populated_screenshot",
              "com.example.skillsync.ui.PilotScreenshotTest#capacityRunway_screenshot",
              "com.example.skillsync.ui.PilotScreenshotTest#thisWeek_empty_screenshot",
          }

          new_failures = failing - known_baseline
          resolved = known_baseline - failing

          print(f"Total tests: {total}")
          print(f"Failing: {len(failing)}")
          for f in sorted(failing):
              tag = "KNOWN" if f in known_baseline else "NEW"
              print(f"  [{tag}] {f}")
          if resolved:
              print("Resolved (no longer failing, was in baseline):")
              for f in sorted(resolved):
                  print(f"  [RESOLVED] {f}")

          if new_failures:
              print("::error::New, unexpected test failures found — see NEW entries above")
              sys.exit(1)
          print("OK: failing-test set is a subset of (or equal to) the known baseline.")
          PYEOF

      - name: Upload full unit-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skilledge-p1-unit-test-report
          path: SkillEdge_Android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run PilotScreenshotInstrumentedTest on emulator (real Android, not Robolectric)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: ./SkillEdge_Android
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.skillsync.ui.PilotScreenshotInstrumentedTest --console=plain

      - name: Upload Today screenshots (real emulator)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skilledge-p1-today-screenshots
          path: SkillEdge_Android/app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: warn

      - name: Upload instrumented test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skilledge-p1-instrumented-test-report
          path: SkillEdge_Android/app/build/reports/androidTests/connected/
          if-no-files-found: warn

      - name: Build debug APK for manual install/test
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: skilledge-p1-validation-debug-apk
          path: SkillEdge_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
