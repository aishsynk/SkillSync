<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SkillEdge | Course Catalog</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <meta http-equiv="refresh" content="0; url=custom-course-match.html" />
  <script>location.replace('custom-course-match.html');</script>
  <link href="/assets/css/vendor.min.css" rel="stylesheet" />
  <link href="/assets/css/default/app.min.css" rel="stylesheet" />
  <link href="/assets/plugins/datatables.net-bs5/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="/assets/plugins/datatables.net-responsive-bs5/css/responsive.bootstrap5.min.css" rel="stylesheet" />
  <link href="/assets/plugins/datatables.net-buttons-bs5/css/buttons.bootstrap5.min.css" rel="stylesheet" />
  <style>
  .course-card{border-radius:12px;border:1px solid #e5e7eb;padding:1rem;transition:all .2s;cursor:pointer;}
  .course-card:hover{border-color:var(--bs-theme);box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-2px);}
  .vendor-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;}
  </style>
</head>
<body class="pace-top">
  <div id="loader" class="app-loader"><span class="spinner"></span></div>

  <div id="app" class="app app-header-fixed app-sidebar-fixed">

    <div id="content" class="app-content">
      <ol class="breadcrumb float-xl-end">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Course Catalog</li>
      </ol>
      <h1 class="page-header">Course Catalog <small>all available courses with vendor &amp; trainer coverage</small></h1>

      <!-- KPI row -->
      <div class="row">
        <div class="col-xl-3 col-md-6">
          <div class="widget widget-stats bg-blue">
            <div class="stats-icon stats-icon-lg"><i class="fa fa-list fa-fw"></i></div>
            <div class="stats-content"><div class="stats-title">TOTAL COURSES</div><div class="stats-number" id="kpCourses">—</div></div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="widget widget-stats bg-teal">
            <div class="stats-icon stats-icon-lg"><i class="fa fa-building fa-fw"></i></div>
            <div class="stats-content"><div class="stats-title">VENDORS</div><div class="stats-number" id="kpVendors">—</div></div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="widget widget-stats bg-green">
            <div class="stats-icon stats-icon-lg"><i class="fa fa-check-circle fa-fw"></i></div>
            <div class="stats-content"><div class="stats-title">TEAM-COVERED</div><div class="stats-number" id="kpCovered">—</div></div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="widget widget-stats bg-red">
            <div class="stats-icon stats-icon-lg"><i class="fa fa-exclamation-circle fa-fw"></i></div>
            <div class="stats-content"><div class="stats-title">COVERAGE GAP</div><div class="stats-number" id="kpGap">—</div></div>
          </div>
        </div>
      </div>

      <!-- Panel with tabs -->
      <div class="panel panel-inverse">
        <div class="panel-heading">
          <div class="panel-heading-btn">
            <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-default" data-toggle="panel-expand"><i class="fa fa-expand"></i></a>
            <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-success" onclick="refreshCatalog()"><i class="fa fa-redo"></i></a>
            <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-warning" data-toggle="panel-collapse"><i class="fa fa-minus"></i></a>
          </div>
          <h4 class="panel-title">Course Catalog</h4>
        </div>
        <div class="panel-toolbar">
          <div class="d-flex gap-2 align-items-center flex-wrap">
            <div class="input-group" style="max-width:240px;">
              <div class="input-group-text position-absolute top-0 bottom-0 bg-none border-0 start-0" style="z-index:1;"><i class="fa fa-search opacity-5"></i></div>
              <input type="text" class="form-control px-35px bg-light" id="courseSearch" placeholder="Search course…" oninput="applyFilters()" />
            </div>
            <select class="form-select form-select-sm" id="vendorFilter" onchange="applyFilters()" style="max-width:180px;"><option value="">All Vendors</option></select>
            <select class="form-select form-select-sm" id="coverageFilter" onchange="applyFilters()" style="max-width:160px;">
              <option value="">All Coverage</option>
              <option value="covered">Covered by Team</option>
              <option value="gap">Coverage Gap</option>
            </select>
            <span class="ms-auto small text-muted">Showing <span id="showCount" class="fw-bold">—</span> courses</span>
          </div>
        </div>
        <ul class="nav nav-tabs nav-tabs-v2 px-3">
          <li class="nav-item me-2"><a href="javascript:;" class="nav-link px-2 active" id="btnGrid" onclick="setView('grid')"><i class="fa fa-th me-1"></i>Grid</a></li>
          <li class="nav-item me-2"><a href="javascript:;" class="nav-link px-2" id="btnList" onclick="setView('list')"><i class="fa fa-list me-1"></i>List</a></li>
        </ul>
        <div class="tab-content p-3">
          <div id="gridView">
            <div class="row g-3" id="courseGrid">
              <div class="col-12 text-center py-5 text-muted"><div class="spinner-border text-theme mb-3" style="width:3rem;height:3rem;"></div><div>Loading course catalog…</div></div>
            </div>
          </div>
          <div id="listView" style="display:none;">
            <div id="listTableWrap"><div class="text-center py-5 text-muted"><div class="spinner-border text-theme"></div></div></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/assets/js/vendor.min.js"></script>
  <script src="/assets/js/app.min.js"></script>
  <script src="/assets/plugins/datatables.net/js/dataTables.min.js"></script>
  <script src="/assets/plugins/datatables.net-bs5/js/dataTables.bootstrap5.min.js"></script>
  <script src="/assets/plugins/datatables.net-responsive/js/dataTables.responsive.min.js"></script>
  <script src="/assets/plugins/datatables.net-responsive-bs5/js/responsive.bootstrap5.min.js"></script>
  <script src="/assets/plugins/datatables.net-buttons/js/dataTables.buttons.min.js"></script>
  <script src="/assets/plugins/datatables.net-buttons-bs5/js/buttons.bootstrap5.min.js"></script>
  <script src="/assets/plugins/datatables.net-buttons/js/buttons.html5.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
  injectLayout('courses.html');

  let allCourses=[], teamCourseIds=new Set(), dtTable=null, currentView='grid', filtered=[];
  const VENDOR_COLORS={'Microsoft':'#0078d4','Amazon':'#ff9900','AWS':'#ff9900','Google':'#4285f4','MongoDB':'#47a248','Cisco':'#1ba0d7','Oracle':'#f80000','CompTIA':'#c8202f','VMware':'#607078','Salesforce':'#00a1e0'};
  function vColor(v){return VENDOR_COLORS[v]||'#6b7280';}

  async function loadCatalog() {
    const [coursesRes, teamRes] = await Promise.allSettled([
      API.getCourseListCached(),
      API.getTeamData(API.getManagerEmail())
    ]);
    allCourses = coursesRes.status==='fulfilled' ? (coursesRes.value||[]) : [];
    const team = teamRes.status==='fulfilled' ? teamRes.value : [];
    team.forEach(t=>{
      (t.details||[]).forEach(d=>{ if(d.CourseName) teamCourseIds.add((d.CourseName||'').toLowerCase().trim()); });
      (t.skills||[]).forEach(s=>{ if(s.course_id) teamCourseIds.add(String(s.course_id)); if(s.course_name) teamCourseIds.add((s.course_name||'').toLowerCase().trim()); });
    });
    populateVendorFilter(); applyFilters(); renderKPIs();
  }

  function isCovered(c){ return teamCourseIds.has(String(c.Courseid))||teamCourseIds.has((c.Course||'').toLowerCase().trim()); }

  function renderKPIs(){
    document.getElementById('kpCourses').textContent = allCourses.length;
    document.getElementById('kpVendors').textContent = new Set(allCourses.map(c=>c.vendor_name||'Other')).size;
    document.getElementById('kpCovered').textContent = allCourses.filter(isCovered).length;
    document.getElementById('kpGap').textContent     = allCourses.filter(c=>!isCovered(c)).length;
  }

  function populateVendorFilter(){
    const vendors=[...new Set(allCourses.map(c=>c.vendor_name||'Other'))].sort();
    const sel=document.getElementById('vendorFilter');
    vendors.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});
  }

  function applyFilters(){
    const q=(document.getElementById('courseSearch').value||'').toLowerCase();
    const vf=document.getElementById('vendorFilter').value;
    const cf=document.getElementById('coverageFilter').value;
    filtered=allCourses.filter(c=>{
      if(q&&!(c.Course||'').toLowerCase().includes(q)) return false;
      if(vf&&(c.vendor_name||'Other')!==vf) return false;
      if(cf==='covered'&&!isCovered(c)) return false;
      if(cf==='gap'&&isCovered(c)) return false;
      return true;
    });
    document.getElementById('showCount').textContent=filtered.length;
    if(currentView==='grid') renderGrid(); else renderList();
  }

  function renderGrid(){
    if(!filtered.length){ document.getElementById('courseGrid').innerHTML='<div class="col-12 text-center text-muted py-4">No courses match your filters.</div>'; return; }
    document.getElementById('courseGrid').innerHTML=filtered.map(c=>{
      const vendor=c.vendor_name||'Other', covered=isCovered(c), col=vColor(vendor);
      return `<div class="col-6 col-md-4 col-lg-3"><div class="course-card h-100">
        <div class="d-flex align-items-start justify-content-between gap-2 mb-2">
          <div class="fw-semibold small" style="line-height:1.3;">${c.Course||'—'}</div>
          ${covered
            ? '<span class="badge border border-success text-success px-2 pt-5px pb-5px rounded fs-12px d-inline-flex align-items-center flex-shrink-0"><i class="fa fa-circle fs-9px fa-fw me-5px"></i>Covered</span>'
            : '<span class="badge border border-warning text-warning px-2 pt-5px pb-5px rounded fs-12px d-inline-flex align-items-center flex-shrink-0"><i class="fa fa-circle fs-9px fa-fw me-5px"></i>Gap</span>'}
        </div>
        <div class="d-flex align-items-center justify-content-between mt-auto">
          <span class="vendor-badge" style="background:${col}18;color:${col};">${vendor}</span>
          <span class="text-muted small">#${c.Courseid||'—'}</span>
        </div>
        ${c.course_url?`<a href="${c.course_url}" target="_blank" class="btn btn-xs btn-outline-default mt-2 w-100"><i class="fa fa-external-link-alt me-1"></i>View</a>`:''}
      </div></div>`;
    }).join('');
  }

  function renderList(){
    document.getElementById('listTableWrap').innerHTML=`
    <div class="table-responsive">
    <table id="courseTable" class="table table-hover table-panel text-nowrap align-middle mb-0 w-100">
      <thead><tr><th>#</th><th>Course</th><th>Vendor</th><th>Course ID</th><th>Coverage</th><th>Link</th></tr></thead>
      <tbody>${filtered.map((c,i)=>{
        const covered=isCovered(c), vendor=c.vendor_name||'Other', col=vColor(vendor);
        return `<tr>
          <td class="text-muted small">${i+1}</td>
          <td><span class="fw-bold">${c.Course||'—'}</span></td>
          <td><span class="vendor-badge" style="background:${col}18;color:${col};">${vendor}</span></td>
          <td><span class="badge border border-default text-body px-2 pt-5px pb-5px rounded fs-12px">${c.Courseid||'—'}</span></td>
          <td>${covered
            ? '<span class="badge border border-success text-success px-2 pt-5px pb-5px rounded fs-12px d-inline-flex align-items-center"><i class="fa fa-circle fs-9px fa-fw me-5px"></i>Covered</span>'
            : '<span class="badge border border-warning text-warning px-2 pt-5px pb-5px rounded fs-12px d-inline-flex align-items-center"><i class="fa fa-circle fs-9px fa-fw me-5px"></i>Gap</span>'}</td>
          <td>${c.course_url?`<a href="${c.course_url}" target="_blank" class="btn btn-xs btn-outline-theme"><i class="fa fa-external-link-alt"></i></a>`:'—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
    if(dtTable){dtTable.destroy();dtTable=null;}
    dtTable=$('#courseTable').DataTable({ responsive:true, pageLength:25, dom:'<"d-flex justify-content-between align-items-center mb-3"<"d-flex gap-2"lB>f>rtip', buttons:[{extend:'csvHtml5',text:'<i class="fa fa-file-csv me-1"></i>CSV',className:'btn btn-sm btn-outline-default'},{extend:'excelHtml5',text:'<i class="fa fa-file-excel me-1"></i>Excel',className:'btn btn-sm btn-outline-default'}], language:{search:'',searchPlaceholder:'Search…',lengthMenu:'Show _MENU_ rows'} });
  }

  function setView(v){
    currentView=v;
    document.getElementById('gridView').style.display=v==='grid'?'':'none';
    document.getElementById('listView').style.display=v==='list'?'':'none';
    document.getElementById('btnGrid').classList.toggle('active',v==='grid');
    document.getElementById('btnList').classList.toggle('active',v==='list');
    if(v==='grid') renderGrid(); else renderList();
  }

  function refreshCatalog(){ API.clearTeamCache(); allCourses=[]; teamCourseIds=new Set(); document.getElementById('courseGrid').innerHTML='<div class="col-12 text-center py-5"><div class="spinner-border text-theme mb-3"></div><div class="text-muted">Refreshing…</div></div>'; loadCatalog(); }

  loadCatalog();
  </script>
</body>
</html>
