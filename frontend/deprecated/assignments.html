<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SkillEdge | Assignments</title>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
  <meta http-equiv="refresh" content="0; url=allocation-desk.html" />
  <script>location.replace('allocation-desk.html');</script>
  <link href="/assets/css/vendor.min.css" rel="stylesheet" />
  <link href="/assets/css/default/app.min.css" rel="stylesheet" />
  <link href="/assets/plugins/datatables.net-bs5/css/dataTables.bootstrap5.min.css" rel="stylesheet" />
  <link href="/assets/plugins/datatables.net-responsive-bs5/css/responsive.bootstrap5.min.css" rel="stylesheet" />
  <link href="/assets/plugins/datatables.net-buttons-bs5/css/buttons.bootstrap5.min.css" rel="stylesheet" />
</head>
<body class="pace-top">
  <div id="loader" class="app-loader"><span class="spinner"></span></div>

  <div id="app" class="app app-header-fixed app-sidebar-fixed">

    <div id="content" class="app-content">
      <ol class="breadcrumb float-xl-end">
        <li class="breadcrumb-item"><a href="index.html">Home</a></li>
        <li class="breadcrumb-item active">Assignments</li>
      </ol>
      <h1 class="page-header">Assignments <small>course delivery history across all trainers</small></h1>

      <!-- KPI row -->
      <div class="row">
        <div class="col-xl-3 col-md-6">
          <div class="widget widget-stats bg-teal">
            <div class="stats-icon stats-icon-lg"><i class="fa fa-book fa-fw"></i></div>
            <div class="stats-content"><div class="stats-title">TOTAL ASSIGNMENTS</div><div class="stats-number" id="kpTotal">—</div><div class="stats-desc"><span id="rowCount">—</span> shown after filter</div></div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="widget widget-stats bg-blue">
            <div class="stats-icon stats-icon-lg"><i class="fa fa-graduation-cap fa-fw"></i></div>
            <div class="stats-content"><div class="stats-title">UNIQUE COURSES</div><div class="stats-number" id="kpCourses">—</div><div class="stats-desc">distinct course IDs</div></div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="widget widget-stats bg-green">
            <div class="stats-icon stats-icon-lg"><i class="fa fa-users fa-fw"></i></div>
            <div class="stats-content"><div class="stats-title">TRAINERS</div><div class="stats-number" id="kpTrainers">—</div><div class="stats-desc">with assignments</div></div>
          </div>
        </div>
        <div class="col-xl-3 col-md-6">
          <div class="widget widget-stats bg-purple">
            <div class="stats-icon stats-icon-lg"><i class="fa fa-trophy fa-fw"></i></div>
            <div class="stats-content"><div class="stats-title">TOP COURSE</div><div class="stats-number fs-14px" id="kpTop">—</div><div class="stats-desc">most assigned</div></div>
          </div>
        </div>
      </div>

      <!-- Table panel -->
      <div class="panel panel-inverse">
        <div class="panel-heading">
          <div class="panel-heading-btn">
            <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-default" data-toggle="panel-expand"><i class="fa fa-expand"></i></a>
            <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-success" onclick="refreshAll()"><i class="fa fa-redo"></i></a>
            <a href="javascript:;" class="btn btn-xs btn-icon btn-circle btn-warning" data-toggle="panel-collapse"><i class="fa fa-minus"></i></a>
          </div>
          <h4 class="panel-title">Assignment History</h4>
        </div>
        <div class="panel-toolbar">
          <div class="d-flex gap-2 align-items-center">
            <select class="form-select form-select-sm" id="trainerFilter" onchange="applyTrainerFilter()" style="max-width:220px;">
              <option value="">All Trainers</option>
            </select>
          </div>
        </div>
        <div class="panel-body p-0">
          <div id="tableWrap">
            <div class="text-center py-5 text-muted">
              <div class="spinner-border text-theme mb-3" style="width:3rem;height:3rem;"></div>
              <div>Loading assignments…</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/assets/js/vendor.min.js"></script>
  <script src="/assets/js/app.min.js"></script>
  <script src="/assets/plugins/datatables.net/js/dataTables.min.js"></script>
  <script src="/assets/plugins/datatables.net-bs5/js/dataTables.bootstrap5.min.js"></script>
  <script src="/assets/plugins/datatables.net-responsive/js/dataTables.responsive.min.js"></script>
  <script src="/assets/plugins/datatables.net-responsive-bs5/js/responsive.bootstrap5.min.js"></script>
  <script src="/assets/plugins/datatables.net-buttons/js/dataTables.buttons.min.js"></script>
  <script src="/assets/plugins/datatables.net-buttons-bs5/js/buttons.bootstrap5.min.js"></script>
  <script src="/assets/plugins/datatables.net-buttons/js/buttons.html5.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
  injectLayout('assignments.html');

  let allAssignments = [], dtTable = null;
  const urlEmail = new URLSearchParams(location.search).get('email') || '';

  async function loadAssignments() {
    const team = await API.getTeamData(API.getManagerEmail());
    const sel = document.getElementById('trainerFilter');
    team.forEach(t => {
      const o = document.createElement('option');
      o.value = t.OffEmail||''; o.textContent = t.TrainerName||t.OffEmail||'—';
      if ((t.OffEmail||'').toLowerCase()===urlEmail.toLowerCase()) o.selected=true;
      sel.appendChild(o);
    });
    await fetchForTrainer(urlEmail);
  }

  async function fetchForTrainer(email) {
    document.getElementById('tableWrap').innerHTML=
      '<div class="text-center py-4"><div class="spinner-border text-theme"></div><div class="mt-2 text-muted small">Fetching assignments…</div></div>';
    allAssignments=[];
    const team=await API.getTeamData(API.getManagerEmail());
    const targets=email ? team.filter(t=>(t.OffEmail||'').toLowerCase()===email.toLowerCase()) : team;
    const results=await Promise.allSettled(targets.map(async t=>{
      const rows=await API.getAssignments(t.OffEmail||'',1,100);
      return (rows||[]).map(r=>({trainerName:t.TrainerName||'—',email:t.OffEmail||'',...r}));
    }));
    results.forEach(r=>{ if(r.status==='fulfilled') allAssignments.push(...r.value); });
    renderKPIs(); buildTable();
  }

  function renderKPIs() {
    const total=allAssignments.length;
    const courses=new Set(allAssignments.map(a=>a.CourseID)).size;
    const trainers=new Set(allAssignments.map(a=>a.email)).size;
    const courseCounts={};
    allAssignments.forEach(a=>{ const c=a.Course||''; courseCounts[c]=(courseCounts[c]||0)+1; });
    const topCourse=Object.entries(courseCounts).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('kpTotal').textContent   =total;
    document.getElementById('kpCourses').textContent =courses;
    document.getElementById('kpTrainers').textContent=trainers;
    document.getElementById('kpTop').innerHTML=topCourse?`<span title="${topCourse[0]}">${(topCourse[0]||'—').slice(0,20)}${topCourse[0]?.length>20?'…':''}</span>`:'—';
    document.getElementById('rowCount').textContent=total;
  }

  function buildTable() {
    document.getElementById('tableWrap').innerHTML=`
    <div class="table-responsive">
    <table id="assignTable" class="table table-hover table-panel text-nowrap align-middle mb-0 w-100">
      <thead><tr><th>#</th><th>Course</th><th>Trainer</th><th>Assignment ID</th><th>Course ID</th><th>Actions</th></tr></thead>
      <tbody>${allAssignments.map((a,i)=>`<tr>
        <td class="text-muted small">${i+1}</td>
        <td><span class="fw-bold">${a.Course||'—'}</span></td>
        <td>
          <a href="trainer-detail.html?email=${encodeURIComponent(a.email)}" class="fw-bold text-body text-decoration-none">${a.trainerName}</a>
          <div class="fs-10px text-muted">${a.email}</div>
        </td>
        <td><span class="badge border border-default text-body px-2 pt-5px pb-5px rounded fs-12px">${a.AssignmentID||'—'}</span></td>
        <td><span class="text-muted small">${a.CourseID||'—'}</span></td>
        <td><a href="trainer-detail.html?email=${encodeURIComponent(a.email)}" class="btn btn-xs btn-outline-theme" title="View trainer"><i class="fa fa-user"></i></a></td>
      </tr>`).join('')}</tbody>
    </table></div>`;

    if(dtTable){dtTable.destroy();dtTable=null;}
    dtTable=$('#assignTable').DataTable({
      responsive:true, pageLength:25,
      dom:'<"d-flex justify-content-between align-items-center mb-3"<"d-flex gap-2"lB>f>rtip',
      buttons:[
        {extend:'csvHtml5',text:'<i class="fa fa-file-csv me-1"></i>CSV',className:'btn btn-sm btn-outline-default'},
        {extend:'excelHtml5',text:'<i class="fa fa-file-excel me-1"></i>Excel',className:'btn btn-sm btn-outline-default'},
      ],
      language:{search:'',searchPlaceholder:'Search…',lengthMenu:'Show _MENU_ rows'},
      drawCallback(){document.getElementById('rowCount').textContent=this.api().rows({search:'applied'}).count();},
    });
    if(urlEmail) dtTable.column(2).search(urlEmail).draw();
  }

  function applyTrainerFilter(){ fetchForTrainer(document.getElementById('trainerFilter').value); }
  function refreshAll(){ API.clearTeamCache(); allAssignments=[]; loadAssignments(); }

  loadAssignments();
  </script>
</body>
</html>
